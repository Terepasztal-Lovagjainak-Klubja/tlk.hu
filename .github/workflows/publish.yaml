name: Publish

# Builds main and deploys it to the repo's GitHub Pages site.
# Pages must be enabled first: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches:
      - main
  workflow_dispatch:

  # Picks up photos added to the Google Drive gallery folders without anyone
  # having to push. GitHub delays scheduled runs under load and disables them
  # entirely after 60 days with no repo activity, so treat this as best effort —
  # workflow_dispatch is the way to force a refresh now.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Not cancel-in-progress: killing a half-finished deploy
# can leave the live site in a broken state, so queued runs wait instead.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      # Explicit ref: main so a manual dispatch from any branch still publishes
      # main, never whatever branch the run was triggered from.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          submodules: 'recursive'

      # Hugo modules are Go modules: config/_default/module.yaml imports
      # hugo-shortcode-gallery, which Hugo fetches through the Go toolchain.
      # setup-go caches by go.sum, so that download is cached too.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pinned to match mise.toml. go.mod pins the gallery module to v1.3.0 for
      # the flip side of the same constraint: v1.4.0+ needs Hugo >= 0.156.0.
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.139.0'
          extended: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/Krypton
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Must run before Hugo. module.yaml mounts @hyas/images layouts and the
      # Font Awesome css/webfonts straight out of node_modules, and Hugo Pipes
      # resolves the SCSS/JS imports and the postcss-cli binary from there.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rolling caches: the run_id suffix means every run saves a fresh entry
      # while restore-keys pulls in the most recent one. Without them each
      # publish re-downloads every photo from Drive and re-runs every Lanczos
      # resize, which is nearly all of the build time once galleries exist.
      - name: Restore mirrored gallery images
        uses: actions/cache@v4
        with:
          path: assets/images/gallery
          key: drive-gallery-${{ hashFiles('data/galleries.json') }}-${{ github.run_id }}
          restore-keys: |
            drive-gallery-${{ hashFiles('data/galleries.json') }}-

      - name: Restore Hugo image cache
        uses: actions/cache@v4
        with:
          path: resources
          key: hugo-resources-${{ github.run_id }}
          restore-keys: |
            hugo-resources-

      # gdown reads Drive's public folder view directly, so there is no API key,
      # no GCP project and no repository secret to keep alive after whoever set
      # this up moves on.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install gdown
        run: pip install -r scripts/requirements.txt

      # Mirrors the public Drive folders listed in data/galleries.json into
      # product/gallery/, where the {{< gallery >}} shortcode can resize
      # them like any other local image. A failure here fails the publish on
      # purpose: shipping half-empty galleries is worse, and the previous deploy
      # stays live either way.
      - name: Sync galleries from Google Drive
        run: python3 scripts/sync_drive_galleries.py

      - name: Sync pdfs from Google Drive
        run: python3 scripts/get_pdf.py

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # --baseURL overrides the https://tlk.hu/ in config/production/config.yaml
      # with whatever Pages actually serves this site from. Today that is
      # https://terepasztal-lovagjainak-klubja.github.io/tlk.hu/; the day a
      # custom domain is set in Settings > Pages, this output becomes
      # https://tlk.hu/ on its own and the override turns into a no-op.
      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
